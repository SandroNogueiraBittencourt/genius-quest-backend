# Carrega o .env da raiz do projeto
spring.config.import=optional:file:.env[.properties]

# Banco exclusivo para testes
spring.datasource.url=jdbc:postgresql://localhost:5433/geniusquest_test
spring.datasource.username=geniusquest
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Durante os testes o Spring não deve controlar o Docker Compose
spring.docker.compose.enabled=false

# Swagger não é necessário nos testes
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
