spring.application.name=genius-quest-backend
server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:geniusquest}
spring.datasource.username=${DB_USER:geniusquest}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Swagger/OpenAPI desativados por padrao (falha fechada em producao).
# Para uso local controlado: APP_OPENAPI_ENABLED=true, exigindo ROLE_ADMIN nas rotas.
springdoc.api-docs.enabled=${APP_OPENAPI_ENABLED:false}
springdoc.swagger-ui.enabled=${APP_OPENAPI_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# CORS - separe multiplas origens por virgula
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Chave tokens (JWT)
app.jwt.secret=${JWT_SECRET}
app.auth.session-cookie.secure=${AUTH_SESSION_COOKIE_SECURE:true}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# smtp: ambiente local/Mailpit; brevo-api: HTTPs (porta 443), recomendado no Render Free.
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.brevo.api-key=${BREVO_API_KEY:}

spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
# Exigir TLS evita enviar credenciais SMTP sem criptografia se STARTTLS nao estiver disponivel.
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.mail.from=${MAIL_FROM:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Rate limit de recuperacao: false em desenvolvimento; true somente no Render publico.
app.security.trust-cloudflare-client-ip=${APP_TRUST_CLOUDFLARE_IP:false}

# Geracao IA: ambos os controles OFF por padrao. Habilitar apenas apos homologacao.
app.ia.enabled=${APP_IA_ENABLED:false}
app.ia.http-enabled=${APP_IA_HTTP_ENABLED:false}
