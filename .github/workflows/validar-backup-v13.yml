name: Backup V13 - Validacao Offline

on:
  pull_request:
    paths:
      - 'scripts/geniusquest_v13_backup_restore.py'
      - 'scripts/tests/test_geniusquest_v13_backup_restore.py'
      - '.github/workflows/validar-backup-v13.yml'

permissions:
  contents: read

jobs:
  offline:
    name: Verificar protecoes de backup V13 sem segredos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxe
        run: python3 -m py_compile scripts/geniusquest_v13_backup_restore.py scripts/tests/test_geniusquest_v13_backup_restore.py
      - name: Testes offline sem acesso a dados reais
        run: python3 -m unittest discover -s scripts/tests -p 'test_geniusquest_v13_backup_restore.py' -v
