name: Backup V12 - Validacao Offline

on:
  push:
    branches:
      - 'chore/etapa2-v12-backup-restore-20261122'
    paths:
      - 'scripts/geniusquest_v12_backup_restore.py'
      - 'scripts/tests/test_geniusquest_v12_backup_restore.py'
      - '.github/workflows/validar-backup-v12.yml'
  pull_request:
    paths:
      - 'scripts/geniusquest_v12_backup_restore.py'
      - 'scripts/tests/test_geniusquest_v12_backup_restore.py'
      - '.github/workflows/validar-backup-v12.yml'

permissions:
  contents: read

jobs:
  offline:
    name: Verificar protecoes locais sem segredos nem producao
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxe
        run: python3 -m py_compile scripts/geniusquest_v12_backup_restore.py scripts/tests/test_geniusquest_v12_backup_restore.py
      - name: Testes offline sem acesso a dados reais
        run: python3 -m unittest discover -s scripts/tests -p 'test_geniusquest_v12_backup_restore.py' -v
