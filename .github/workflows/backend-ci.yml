name: Backend CI

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'chore/**'

  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    name: Testes Maven
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_DB: geniusquest_test
          POSTGRES_USER: geniusquest
          POSTGRES_PASSWORD: geniusquest_ci

        ports:
          - 5433:5432

        options: >-
          --health-cmd="pg_isready -U geniusquest -d geniusquest_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_PASSWORD: geniusquest_ci

      SPRING_DOCKER_COMPOSE_ENABLED: false

      JWT_SECRET: R2VuaXVzUXVlc3QtQ0ktU2VjcmV0LVRlc3RlLTEyMzQ1Njc4OTA=
      JWT_EXPIRATION_MS: 3600000

      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Sao_Paulo

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Dar permissão ao Maven Wrapper
        run: chmod +x mvnw

      - name: Executar testes
        run: ./mvnw -B clean test