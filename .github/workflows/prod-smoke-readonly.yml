name: Production HTTP Smoke - Read Only

on:
  pull_request:
    branches: [develop]
    paths:
      - 'scripts/smoke_producao_readonly.py'
      - '.github/workflows/prod-smoke-readonly.yml'
  push:
    branches: [develop]
    paths:
      - 'scripts/smoke_producao_readonly.py'
      - '.github/workflows/prod-smoke-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Verificar health, Swagger, 401, CORS e frontend sem escritas
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxe do smoke test
        run: python3 -m py_compile scripts/smoke_producao_readonly.py
      - name: Validar endpoints publicos em modo somente leitura
        run: python3 scripts/smoke_producao_readonly.py
