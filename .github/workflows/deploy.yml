name: Deploy Render API
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: genius-quest-api-deploy
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: geniusquest_test
          POSTGRES_USER: geniusquest
          POSTGRES_PASSWORD: geniusquest_ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U geniusquest -d geniusquest_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_PASSWORD: geniusquest_ci
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      JWT_SECRET: R2VuaXVzUXVlc3QtQ0ktU2VjcmV0LVRlc3RlLTEyMzQ1Njc4OTA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Testar aplicacao
        run: bash ./mvnw -B clean verify
      - name: Verificar imagem Docker
        run: docker build -t genius-quest-api:ci .
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Disparar deploy do Render
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOOK" || { echo "::error::Configure RENDER_DEPLOY_HOOK_URL"; exit 1; }
          curl --fail --silent --show-error --retry 3 -X POST "$DEPLOY_HOOK"
