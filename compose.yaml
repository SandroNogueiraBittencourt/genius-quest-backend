# Ambiente de desenvolvimento: PostgreSQL 18 + Spring Boot.
# cp .env.example .env && configure as senhas e JWT_SECRET.
# docker compose up --build -d
services:
  postgres:
    image: postgres:18
    container_name: genius-quest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geniusquest}
      POSTGRES_USER: ${POSTGRES_USER:-geniusquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - genius_quest_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geniusquest} -d ${POSTGRES_DB:-geniusquest}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: genius-quest-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SERVER_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-geniusquest}
      DB_USER: ${POSTGRES_USER:-geniusquest}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  genius_quest_postgres_data:
